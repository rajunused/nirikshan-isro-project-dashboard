# =============================================================================
# ISRO NIRIKSHAN AI-Driven Dynamic ESS Intelligence & Latent-Defect Screening
# Alembic Migration Configuration
# =============================================================================

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

sqlalchemy.url = postgresql+asyncpg://isro_admin:isro_secure_ess_password@localhost:5432/nirikshan_ess

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
